version: "3.8"

services:
  bot:
    build: .
    container_name: weather-bot
    env_file:
      - .env
    volumes:
      # Persistent volume for SQLite database - survives container rebuilds
      - weather-bot-data:/data
    restart: unless-stopped

volumes:
  weather-bot-data:
    # Named volume ensures data persists across container rebuilds
    name: weather-bot-data
